name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: s1
      - uses: actions/setup-java@v4
        id: s2
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        id: s3
        with:
          gradle-version: '8.5'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - run: cp app/build/outputs/apk/debug/app-debug.apk NexusOffline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexusOffline-debug-apk
          path: NexusOffline.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NexusOffline.apk --title "NEXUS Offline (latest build)" --notes "Debug APK built from the latest commit." --target "$GITHUB_SHA"
      - name: Save error log to branch buildlog
        if: failure()
        run: |
          mkdir -p /tmp/l
          if [ -f build.log ]; then tail -n 250 build.log > /tmp/l/build.log; else echo "Failed before gradle. checkout=${{ steps.s1.outcome }} java=${{ steps.s2.outcome }} setup-gradle=${{ steps.s3.outcome }} ANDROID_HOME=$ANDROID_HOME" > /tmp/l/build.log; fi
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/l/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin buildlog
